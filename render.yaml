# =============================================================
# SQL Lab — configuração de publicação no Render
# =============================================================
#
# Este arquivo descreve a API do laboratório como um serviço do Render. Ele
# serve de referência exata do que precisa ser configurado no painel, e pode
# ser aplicado direto pelo Render (New -> Blueprint).
#
# Nada de segredo fica aqui: as duas conexões do banco são marcadas com
# `sync: false`, e o Render pede o valor na hora de criar o serviço.
#
# Sobre o monorepo
# ----------------
# O repositório é um monorepo com workspaces npm, e a API depende do pacote
# compartilhado `@sql-lab/shared`. Por isso:
#
#   Root Directory    a raiz do repositório (vazio). Com `apps/api`, o npm não
#                     enxerga o workspace compartilhado, e a instalação falha.
#   Build Command     compila o pacote compartilhado e depois a API.
#   Start Command     sobe a API já compilada, a partir da raiz.
#
# O caminho relativo da pasta de trabalho do Render é `apps/api/dist`, e é
# por isso que o start command usa `apps/api/dist/index.js`.

services:
  - type: web
    name: sql-lab-api
    runtime: node
    plan: free
    # A raiz do repositório: o build precisa do monorepo inteiro.
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=@sql-lab/shared && npm run build --workspace=@sql-lab/api
    startCommand: node apps/api/dist/index.js
    # Liveness: responde mesmo com o banco hibernando. Se o health check
    # dependesse do banco, o serviço entraria em reinício contínuo — que é
    # mais caro do que esperar o banco acordar.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Usuário com apenas SELECT: é quem executa as consultas do aluno.
      - key: DATABASE_URL
        sync: false
      # Usuário dono do schema: grava o progresso e prepara o banco.
      - key: DATABASE_ADMIN_URL
        sync: false
      # Origem da interface, sem barra final. Para liberar mais de uma,
      # separe por virgula.
      - key: ALLOWED_ORIGIN
        sync: false
      - key: MAX_RESULT_ROWS
        value: 200
      - key: QUERY_TIMEOUT_MS
        value: 5000
      - key: PORT
        value: 3000
