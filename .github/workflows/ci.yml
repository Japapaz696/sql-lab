name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Formatação, lint, tipos, build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sql_lab
          POSTGRES_PASSWORD: sql_lab
          POSTGRES_DB: sql_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sql_lab -d sql_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_VERSION: 20
      # Senha do papel de execução. É de um banco efêmero, que o CI cria e
      # destrói a cada execução — não é credencial de nada que exista fora
      # daqui. No deploy, essa senha é definida por variável de ambiente.
      SQL_LAB_EXEC_PASSWORD: senha-ci-efemera-do-sql-lab
      # O papel de execução é o que a aplicação usa: só tem SELECT.
      DATABASE_URL: postgresql://sql_lab_exec:senha-ci-efemera-do-sql-lab@localhost:5432/sql_lab
      # O papel administrativo é o que prepara o banco.
      DATABASE_ADMIN_URL: postgresql://sql_lab:sql_lab@localhost:5432/sql_lab
      TEST_DATABASE_URL: postgresql://sql_lab_exec:senha-ci-efemera-do-sql-lab@localhost:5432/sql_lab_test
      TEST_DATABASE_ADMIN_URL: postgresql://sql_lab:sql_lab@localhost:5432/sql_lab_test

    steps:
      - name: Fazer checkout do repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir que o .env nao esta versionado
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERRO: o arquivo .env nao pode estar versionado."
            exit 1
          fi
          echo "ok: .env nao versionado"

      - name: Conferir que nenhum segredo esta versionado
        run: |
          if git grep -nE "postgres(ql)?://[^:]+:[^@[:space:]]+@" -- \
            ':!*.md' ':!docs/*' ':!.github/workflows/*' | grep -v "senha-ci-efemera" | grep -v "@localhost" | grep -v "@127.0.0.1"; then
            echo "ERRO: ha uma string de conexao com senha no repositorio."
            exit 1
          fi
          echo "ok: nenhuma string de conexao com senha no repositorio"

      # O banco de teste precisa existir antes: a concessão de CONNECT sai
      # sobre um banco que ainda não existe.
      - name: Criar o banco de testes
        env:
          PGPASSWORD: sql_lab
        run: |
          psql -h localhost -p 5432 -U sql_lab -d postgres -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_database WHERE datname='sql_lab_test'" | grep -q 1 \
            || psql -h localhost -p 5432 -U sql_lab -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE sql_lab_test"

      # O papel de execução precisa existir antes da aplicação subir.
      # Ele tem apenas SELECT: a separação de privilégios é a terceira camada
      # de proteção, depois do protocolo estendido e da transação READ ONLY.
      - name: Criar o papel de execucao
        env:
          PGPASSWORD: sql_lab
          SQL_LAB_EXEC_PASSWORD: senha-ci-efemera-do-sql-lab
        run: |
          psql -h localhost -p 5432 -U sql_lab -d postgres -v ON_ERROR_STOP=1 <<SQL
          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sql_lab_exec') THEN
              CREATE ROLE sql_lab_exec LOGIN PASSWORD '${SQL_LAB_EXEC_PASSWORD}';
            END IF;
          END
          \$\$;
          GRANT CONNECT ON DATABASE sql_lab TO sql_lab_exec;
          GRANT CONNECT ON DATABASE sql_lab_test TO sql_lab_exec;
          SQL

      - name: Rodar a validacao completa
        run: npm run validate

      # O papel de execução não pode ter nenhum privilégio além de SELECT.
      # A verificação usa `has_table_privilege`, que já considera os
      # privilégios herdados por memberships: um papel sem INSERT na tabela
      # ainda assim escreveria se pertencesse a outro papel com INSERT.
      - name: Conferir a separacao de privilegios
        env:
          PGPASSWORD: sql_lab
        run: |
          fudgy=$(psql -h localhost -p 5432 -U sql_lab -d sql_lab_test -tAc "
             SELECT count(*) FROM pg_class c
               JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r'
                AND has_table_privilege('sql_lab_exec', c.oid, 'INSERT,UPDATE,DELETE,TRUNCATE')")
          if [ "$fudgy" != "0" ]; then
            echo "ERRO: o papel de execucao tem $(echo "$fudgy" | tr -d ' ') tabela(s) com privilegio de escrita."
            exit 1
          fi
          if [ "$(psql -h localhost -p 5432 -U sql_lab -d sql_lab_test -tAc \
                 "SELECT has_schema_privilege('sql_lab_exec','public','CREATE')")" != "f" ]; then
            echo "ERRO: o papel de execucao pode criar objetos no schema."
            exit 1
          fi
          echo "ok: o papel de execucao so tem SELECT"

      # A API montada precisa subir de verdade, em modo de produção, com as
      # duas conexões separadas. É exatamente o que o Render vai rodar.
      - name: Conferir que a API montada sobe em producao
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://sql_lab_exec:senha-ci-efemera-do-sql-lab@localhost:5432/sql_lab_test
          DATABASE_ADMIN_URL: postgresql://sql_lab:sql_lab@localhost:5432/sql_lab_test
        run: |
          node apps/api/dist/index.js > /tmp/api.txt 2>&1 &
          PID=$!
          for tentativa in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          echo "--- health"
          curl -sf http://127.0.0.1:3000/health
          echo "--- ready"
          curl -sf http://127.0.0.1:3000/ready
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          if ! grep -q 'SQL Lab API em' /tmp/api.txt; then
            echo "ERRO: a API nao subiu."
            cat /tmp/api.txt
            exit 1
          fi
          echo "ok: a API montada sobe em producao"

      # E precisa recusar subir quando a separação não está de pé: é a
      # garantia de que um erro de configuração não vira um laboratório
      # rodando com um usuário que escreve no banco.
      - name: Conferir que a API recusa subir sem separacao de privilegios
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://sql_lab:sql_lab@localhost:5432/sql_lab_test
          DATABASE_ADMIN_URL: postgresql://sql_lab:sql_lab@localhost:5432/sql_lab_test
        run: |
          set +e
          timeout 30 node apps/api/dist/index.js > /tmp/api-sem-separacao.txt 2>&1
          codigo=$?
          set -e
          if [ "$codigo" != "1" ]; then
            echo "ERRO: a API nao recusou subir (codigo de saida $codigo)."
            cat /tmp/api-sem-separacao.txt
            exit 1
          fi
          if ! grep -q "separação de privilégios" /tmp/api-sem-separacao.txt; then
            echo "ERRO: a API recusou subir sem explicar o motivo."
            cat /tmp/api-sem-separacao.txt
            exit 1
          fi
          echo "ok: a API recusa subir sem a separacao de privilegios"

      # A interface precisa ser montada com caminho relativo, para funcionar
      # tanto na raiz quanto num subcaminho (como o GitHub Pages).
      - name: Conferir a montagem da interface
        env:
          VITE_API_URL: https://api.exemplo.invalid
        run: |
          npm run build --workspace=@sql-lab/web
          test -f apps/web/dist/index.html || { echo "ERRO: a interface nao foi montada."; exit 1; }
          if grep -q 'src="/assets/' apps/web/dist/index.html; then
            echo "ERRO: a interface usa caminho absoluto e nao funciona em subcaminho."
            exit 1
          fi
          if ! grep -q 'https://api.exemplo.invalid' apps/web/dist/assets/*.js; then
            echo "ERRO: a URL da API nao entrou no bundle da interface."
            exit 1
          fi
          echo "ok: a interface foi montada com caminho relativo"
      # O Render define NODE_ENV=production já na fase de build. Com essa
      # variável, o npm omite as devDependencies — e é de lá que vem o
      # TypeScript e o Vite, que compilam o projeto. Sem `--include=dev`, o
      # build morre antes de compilar qualquer linha. O CI repete a
      # instalação do jeito do Render, para que a falha apareça aqui e não
      # no deploy.
      - name: Conferir o build de producao
        env:
          NODE_ENV: production
        run: |
          rm -rf apps/api/dist apps/web/dist packages/shared/dist
          npm ci --include=dev
          npm run build --workspace=@sql-lab/shared
          npm run build --workspace=@sql-lab/api
          test -f apps/api/dist/index.js || { echo "ERRO: a API nao foi montada."; exit 1; }
          echo "ok: a API monta com NODE_ENV=production"

      # E a configuração versionada precisa trazer a flag certa, senão o
      # serviço no Render nasce com o build quebrado.
      - name: Conferir o comando de build do Render
        run: |
          if ! grep -q "npm ci --include=dev" render.yaml; then
            echo "ERRO: o build command do Render precisa de --include=dev."
            exit 1
          fi
          if ! grep -q "node apps/api/dist/index.js" render.yaml; then
            echo "ERRO: o start command do Render nao aponta para a API montada."
            exit 1
          fi
          echo "ok: a configuracao do Render instala as dependencias de build"

      - name: Conferir as dependencias de producao
        run: npm audit --omit=dev --audit-level=high
