name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Formatação, lint, tipos, build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sql_lab
          POSTGRES_PASSWORD: sql_lab
          POSTGRES_DB: sql_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sql_lab -d sql_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_VERSION: 20
      DATABASE_URL: postgresql://sql_lab:sql_lab@localhost:5432/sql_lab
      TEST_DATABASE_URL: postgresql://sql_lab:sql_lab@localhost:5432/sql_lab_test

    steps:
      - name: Fazer checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir que o .env nao esta versionado
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERRO: o arquivo .env nao pode estar versionado."
            exit 1
          fi
          echo "ok: .env nao versionado"

      # O banco de teste precisa existir antes da suite.
      - name: Criar o banco de testes
        env:
          PGPASSWORD: sql_lab
        run: |
          psql -h localhost -p 5432 -U sql_lab -d postgres -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_database WHERE datname='sql_lab_test'" | grep -q 1 \
            || psql -h localhost -p 5432 -U sql_lab -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE sql_lab_test"

      - name: Rodar a validacao completa
        run: npm run validate

      - name: Conferir as dependencias de producao
        run: npm audit --omit=dev --audit-level=high
