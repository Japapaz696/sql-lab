name: Publicar a interface no GitHub Pages

# Este workflow é manual de propósito: o repositório fica pronto para
# publicar, mas nada é publicado sem alguém pedir.
#
# Antes de rodar a primeira vez:
#
#   1. no repositório, Settings -> Pages -> Source = "GitHub Actions";
#   2. confira a URL da API e o caminho base (os padrões já são os da
#      demonstração).
#
# A URL da API é lida na hora do build: mudá-la exige rodar o workflow de
# novo.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL da API publicada (o caminho /api/v1 é acrescentado se faltar)'
        required: false
        type: string
        default: https://sql-lab-api-7bdv.onrender.com
      base_path:
        description: 'Caminho base da interface. Um repositório de usuário é servido em /<repositorio>/.'
        required: false
        type: string
        default: /sql-lab/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Build e publicação da interface
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}

    steps:
      - name: Fazer checkout do repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # O Pages compila a interface: as devDependencies (Vite, TypeScript) são
      # necessárias aqui. O `NODE_ENV` do job não é de produção, mas a flag
      # deixa o comportamento explícito e independente do ambiente.
      - name: Instalar dependencias
        run: npm ci --include=dev

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build da interface
        env:
          VITE_API_URL: ${{ inputs.api_url }}
          VITE_BASE_PATH: ${{ inputs.base_path }}
        run: |
          npm run build --workspace=@sql-lab/shared
          npm run build --workspace=@sql-lab/web

      # O build tem que servir a interface do jeito que ela vai ser pedida, e
      # falar com a API no endereço certo. É aqui que uma barra a mais, ou
      # uma URL de API sem o caminho das rotas, aparece como build quebrado —
      # e não como demonstração que abre vazia.
      - name: Conferir a montagem
        run: |
          test -f apps/web/dist/index.html || { echo "ERRO: a interface nao foi montada."; exit 1; }

          if grep -q 'src="/assets/' apps/web/dist/index.html; then
            echo "ERRO: a interface usa caminho absoluto e nao funciona em subcaminho."
            exit 1
          fi

          if ! grep -q "${{ inputs.base_path }}assets/" apps/web/dist/index.html; then
            echo "ERRO: os arquivos nao apontam para o caminho base '${{ inputs.base_path }}'."
            cat apps/web/dist/index.html
            exit 1
          fi

          if ! grep -q "${{ inputs.api_url }}" apps/web/dist/assets/*.js; then
            echo "ERRO: a URL da API nao entrou no bundle da interface."
            exit 1
          fi

          # O bundle é público: não pode carregar string de conexão com
          # credencial nem nome de variável de ambiente do servidor.
          if grep -rqE "postgres(ql)?://[^:]+:[^@[:space:]]+@|DATABASE_URL|DATABASE_ADMIN_URL|SQL_LAB_EXEC_PASSWORD" apps/web/dist/assets/*.js; then
            echo "ERRO: o bundle da interface contem algo que parece credencial."
            exit 1
          fi

          echo "ok: a interface foi montada para ${{ inputs.base_path }} e aponta para a API"

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
